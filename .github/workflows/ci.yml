name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$out" ]; then echo "以下文件未格式化："; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

  generate:
    name: 生成物与 IR 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: 重新生成并检查差异
        run: |
          make generate
          if ! git diff --exit-code -- types 'service_*_gen.go'; then
            echo "::error::生成物与 protocol/protocol-1.3.0.json 不一致，请运行 make generate 并提交"
            exit 1
          fi

      - name: 生成物 golden 测试
        run: go test ./internal/codegen -run 'TestGolden|TestIRBaseline' -v

  coverage:
    name: 覆盖率（排除生成物与示例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: cover
        run: make cover
