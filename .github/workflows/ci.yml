name: CI

on:
  push:
    branches: [main, refactor/onebot-v11]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$out" ]; then echo "以下文件未格式化："; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

  coverage:
    name: 覆盖率（排除示例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: cover
        run: make cover
